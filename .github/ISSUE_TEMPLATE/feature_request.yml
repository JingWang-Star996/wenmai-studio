name: Feature request
description: Propose a bounded improvement to Wenmai.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private URLs, personal data, or other sensitive material.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user need or workflow limitation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful outcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
