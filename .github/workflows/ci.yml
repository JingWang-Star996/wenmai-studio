name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Windows verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run test:public-release
      - run: npm run lint
      - run: npm run test:public-data
      - run: npm run build
      - run: npm run test:agent-access
      - run: npm run test:local-import
      - run: npm run test:agent-client
      - run: npm run test:mcp
      - run: npm run test:vnext
