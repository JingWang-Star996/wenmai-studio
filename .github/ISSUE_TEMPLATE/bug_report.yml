name: Bug report
description: Report a reproducible problem in Wenmai.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Wenmai. Do not include credentials, access tokens, private URLs, personal data, or other sensitive material. For suspected vulnerabilities, use the repository Security page instead of this form.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and its impact.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Give the smallest reproducible sequence.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Wenmai version or commit
  - type: dropdown
    id: platform
    attributes:
      label: Operating system
      options:
        - Windows
        - Other
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or screenshots
      description: Remove secrets, private paths, host names, and personal information before submitting.
